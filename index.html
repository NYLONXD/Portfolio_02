    <script>
      // Runs before first paint: restore the saved theme, and play the boot screen
      // once per session unless the visitor prefers reduced motion.
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem("hj-theme");
          if (theme === "amber" || theme === "green" || theme === "paper") root.dataset.theme = theme;
          if (localStorage.getItem("hj-crt") === "off") root.dataset.crt = "off";
        } catch (e) {}
        try {
          var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (!reduce && !sessionStorage.getItem("hj-booted")) {
            root.dataset.boot = "1";
            sessionStorage.setItem("hj-booted", "1");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
